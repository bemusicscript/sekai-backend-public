  <text x="365" y="794" fill="#f0fdf4" font-size="11" font-weight="600">Python 3.14  ·  every 4h</text>
  <text x="365" y="812" fill="#4ade80" font-size="10">Event ranking · Border tracking</text>
  <text x="365" y="826" fill="#16a34a" font-size="9">⚠ Host</text>

  <!-- Arrow: mawashi → mariadb -->
  <line x1="590" y1="804" x2="750" y2="804" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- ═══ INFRA + WATCHTOWER ═══ -->
  <rect x="640" y="756" width="148" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" filter="url(#shadow-sm)"/>
  <text x="665" y="776" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1">INFRA  ·  :8000</text>
  <text x="665" y="794" fill="#cbd5e1" font-size="10">FastAPI · Py 3.14</text>
  <text x="665" y="810" fill="#64748b" font-size="9">Monitoring · Watchdog</text>
  <text x="665" y="824" fill="#16a34a" font-size="9">⚠  Host</text>

  <rect x="800" y="756" width="148" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" filter="url(#shadow-sm)"/>
  <text x="825" y="776" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1">WATCHTOWER</text>
  <text x="825" y="794" fill="#cbd5e1" font-size="10">v1.7.1</text>
  <text x="825" y="810" fill="#64748b" font-size="9">Docker auto-updates</text>
  <text x="825" y="824" fill="#16a34a" font-size="9">⚠ Host</text>

  <!-- ═══ EGRESS ALLOWLIST ═══ -->
  <rect x="30" y="876" width="940" height="95" rx="10" fill="#0f1f14" stroke="#166534" stroke-width="1" filter="url(#shadow-sm)"/>
  <text x="60" y="898" fill="#4ade80" font-size="11" font-weight="700" letter-spacing="1">EGRESS ALLOWLIST  (via Envoy RBAC)</text>
  <line x1="60" y1="906" x2="940" y2="906" stroke="#166534" stroke-width="1"/>
  <text x="70" y="924" fill="#86efac" font-size="10" font-weight="600">jiiku+api:</text>
  <text x="175" y="924" fill="#6ee7b7" font-size="10">github.com  ·  githubusercontent.com</text>
  <text x="70" y="942" fill="#86efac" font-size="10" font-weight="600">bot only:</text>
  <text x="175" y="942" fill="#6ee7b7" font-size="10">discord.com  ·  discord.gg  ·  discord.media</text>
  <text x="70" y="958" fill="#86efac" font-size="10" font-weight="600">jiiku only:</text>
  <text x="175" y="958" fill="#6ee7b7" font-size="10">nodejs.org  ·  storage.googleapis.com  ·  bazel.build</text>
  <text x="560" y="924" fill="#86efac" font-size="10" font-weight="600">api only:</text>
  <text x="635" y="924" fill="#6ee7b7" font-size="10">Discord endpoints  ·  Cloudflare R2  ·  Web mirrors</text>

  <!-- ═══ CRON SCHEDULE ═══ -->
  <rect x="30" y="982" width="940" height="170" rx="10" fill="#1e1230" stroke="#7c3aed" stroke-width="1" filter="url(#shadow-sm)"/>
  <text x="60" y="1004" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1">CRON SCHEDULE</text>
  <line x1="60" y1="1012" x2="940" y2="1012" stroke="#4c1d95" stroke-width="1"/>

  <!-- col 1 -->
  <text x="70" y="1034" fill="#6d28d9" font-size="10" font-family="monospace">* * * * *</text>
  <text x="200" y="1034" fill="#c4b5fd" font-size="10">Current event runner</text>
  <text x="70" y="1054" fill="#6d28d9" font-size="10" font-family="monospace">*/5 * * * *</text>
  <text x="200" y="1054" fill="#c4b5fd" font-size="10">Event scoreboard runner</text>
  <text x="70" y="1074" fill="#6d28d9" font-size="10" font-family="monospace">*/20 * * * *</text>
  <text x="200" y="1074" fill="#c4b5fd" font-size="10">Predictions + honor collections</text>
  <text x="70" y="1094" fill="#6d28d9" font-size="10" font-family="monospace">10,30,50 * * * *</text>
  <text x="200" y="1094" fill="#c4b5fd" font-size="10">Statistics runner</text>
  <text x="70" y="1114" fill="#6d28d9" font-size="10" font-family="monospace">1,31 * * * *</text>
  <text x="200" y="1114" fill="#c4b5fd" font-size="10">Asset DB sync</text>

  <!-- col 2 -->
  <text x="500" y="1034" fill="#6d28d9" font-size="10" font-family="monospace">10,13,15h GMT+9</text>
  <text x="650" y="1034" fill="#c4b5fd" font-size="10">Character assets + apphash</text>
  <text x="500" y="1054" fill="#6d28d9" font-size="10" font-family="monospace">01:15, 13:15 GMT+9</text>
  <text x="650" y="1054" fill="#c4b5fd" font-size="10">IKEA asset dump</text>
  <text x="500" y="1074" fill="#4ade80" font-size="10" font-family="monospace">0 */4 * * *  [HOST]</text>
  <text x="650" y="1074" fill="#86efac" font-size="10">mawashi sort.py</text>

  <!-- Footer -->
  <line x1="30" y1="1168" x2="970" y2="1168" stroke="#1e293b" stroke-width="1"/>
  <text x="500" y="1188" text-anchor="middle" fill="#334155" font-size="10">Python 3.14  ·  PHP 8.4  ·  MariaDB 12.2  ·  Valkey 9  ·  Caddy 2.11.2  ·  Envoy 1.37  ·  Bazelisk v1.28.1</text>

