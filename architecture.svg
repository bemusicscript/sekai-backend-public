  <line x1="480" y1="1248" x2="530" y2="1248" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="540" y="1252" fill="#94a3b8" font-size="10">Egress via proxy</text>

  <line x1="700" y1="1248" x2="750" y2="1248" stroke="#f87171" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="760" y="1252" fill="#94a3b8" font-size="10">Cache (Valkey)</text>

  <rect x="70" y="1270" width="14" height="14" rx="3" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="92" y="1281" fill="#94a3b8" font-size="10">Runs on host (outside Docker)</text>

  <rect x="280" y="1270" width="14" height="14" rx="3" fill="url(#card-green)"/>
  <text x="302" y="1281" fill="#94a3b8" font-size="10">Application service</text>

  <rect x="480" y="1270" width="14" height="14" rx="3" fill="url(#card-slate)"/>
  <text x="502" y="1281" fill="#94a3b8" font-size="10">Infrastructure service</text>

  <rect x="700" y="1270" width="14" height="14" rx="3" fill="url(#card-orange)"/>
