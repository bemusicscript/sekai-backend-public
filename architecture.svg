<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000033"/>
    </filter>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000022"/>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="docker-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#172b47"/>
    </linearGradient>
    <linearGradient id="card-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="card-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="card-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="card-slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="card-pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1320" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700" letter-spacing="2">sekai.run infrastructure</text>
  <line x1="100" y1="54" x2="900" y2="54" stroke="#334155" stroke-width="1"/>

  <!-- ═══ INTERNET ═══ -->
  <rect x="370" y="68" width="260" height="52" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="430" y="89" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">INTERNET</text>
  <text x="430" y="107" fill="#64748b" font-size="10">Public HTTPS Traffic</text>

  <!-- Arrow: internet → cloudflare -->
  <line x1="500" y1="120" x2="500" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="133" fill="#64748b" font-size="9">HTTPS</text>

  <!-- ═══ CLOUDFLARE ═══ -->
  <rect x="330" y="142" width="340" height="52" rx="10" fill="#1c1917" stroke="#d97706" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <text x="390" y="163" fill="#fbbf24" font-size="11" font-weight="600" letter-spacing="1">☁  CLOUDFLARE</text>
  <text x="390" y="181" fill="#92400e" font-size="10">DNS · DDoS Protection · CDN</text>

  <!-- Arrow: cloudflare → caddy (tunnel label) -->
  <line x1="500" y1="194" x2="500" y2="218" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="510" y="210" fill="#60a5fa" font-size="9">cloudflared tunnel</text>

  <!-- ═══ DOCKER BOUNDARY ═══ -->
  <rect x="30" y="222" width="940" height="840" rx="14" fill="url(#docker-grad)" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <rect x="30" y="222" width="940" height="26" rx="14" fill="#1e3a5f"/>
  <rect x="30" y="236" width="940" height="12" fill="#1e3a5f"/>
  <text x="60" y="240" fill="#60a5fa" font-size="11" font-weight="600" letter-spacing="1">DOCKER  ·  172.30.30.0/24</text>
  <text x="880" y="240" fill="#3b82f6" font-size="10">sekai network</text>

  <!-- ═══ CADDY ═══ -->
  <rect x="320" y="258" width="360" height="68" rx="10" fill="url(#card-blue)" filter="url(#shadow)"/>
  <text x="345" y="278" fill="#bfdbfe" font-size="10" font-weight="700" letter-spacing="1">CADDY  ·  :443  ·  .69</text>
  <text x="345" y="295" fill="#eff6ff" font-size="11" font-weight="600">Caddy 2.x  ·  TLS Termination</text>
  <text x="345" y="312" fill="#93c5fd" font-size="10">CrowdSec WAF  ·  Rate Limiting  ·  Security</text>

  <!-- Arrow: caddy → web -->
  <line x1="500" y1="326" x2="500" y2="350" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="510" y="341" fill="#60a5fa" font-size="9">HTTPS :4443</text>

  <!-- ═══ WEB ═══ -->
  <rect x="290" y="352" width="420" height="80" rx="10" fill="url(#card-purple)" filter="url(#shadow)"/>
  <text x="315" y="372" fill="#ddd6fe" font-size="10" font-weight="700" letter-spacing="1">WEB  ·  :4443  ·  .67</text>
  <text x="315" y="390" fill="#f5f3ff" font-size="11" font-weight="600">Nginx  ·  PHP 8.4  ·  FPM (16–32 workers)</text>
  <text x="315" y="407" fill="#c4b5fd" font-size="10">api.sekai.run  asset.sekai.run</text>
  <text x="315" y="422" fill="#a78bfa" font-size="9">→ js-obfuscator  ·  html-minifier  ·  clean-css</text>

  <!-- Arrow: web → api -->
  <line x1="340" y1="432" x2="340" y2="500" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="355" y="470" fill="#60a5fa" font-size="9">HTTP :5000</text>

  <!-- ═══ API ═══ -->
  <rect x="60" y="502" width="300" height="106" rx="10" fill="url(#card-green)" filter="url(#shadow)"/>
  <text x="85" y="522" fill="#a7f3d0" font-size="10" font-weight="700" letter-spacing="1">API  ·  :5000  ·  .4</text>
  <text x="85" y="540" fill="#f0fdf4" font-size="11" font-weight="600">FastAPI  ·  Python 3.14</text>
  <text x="85" y="558" fill="#6ee7b7" font-size="10">· Event scoring &amp; predictions</text>
  <text x="85" y="574" fill="#6ee7b7" font-size="10">· Scoreboard &amp; asset updates over Discord/Web</text>
  <text x="85" y="590" fill="#6ee7b7" font-size="10">· fastapi+uvloop+httptools  · httpx · orjson · aiocache</text>

  <!-- ═══ VALKEY ═══ -->
  <rect x="640" y="352" width="220" height="80" rx="10" fill="url(#card-red)" filter="url(#shadow)"/>
  <text x="665" y="372" fill="#fecaca" font-size="10" font-weight="700" letter-spacing="1">VALKEY  ·  :6379  ·  .2</text>
  <text x="665" y="390" fill="#fff1f2" font-size="11" font-weight="600">Valkey 9</text>
  <text x="665" y="407" fill="#fca5a5" font-size="10">Sessions · Cache · ACL</text>
  <text x="665" y="422" fill="#f87171" font-size="9">aiocache (py)  ·  php-redis (php)</text>
  <line x1="750" y1="804" x2="750" y2="582" stroke="#fb923c" stroke-width="1.2" marker-end="url(#arrow-orange)"/>

  <!-- Arrow: web → valkey -->
  <line x1="710" y1="352" x2="710" y2="336" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="336" x2="650" y2="336" stroke="#f87171" stroke-width="1.5"/>
  <line x1="650" y1="336" x2="650" y2="352" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: api → valkey -->
  <line x1="360" y1="545" x2="640" y2="410" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- ═══ MARIADB ═══ -->
  <rect x="640" y="502" width="220" height="80" rx="10" fill="url(#card-orange)" filter="url(#shadow)"/>
  <text x="665" y="522" fill="#fed7aa" font-size="10" font-weight="700" letter-spacing="1">MARIADB  ·  :3306  ·  .5</text>
  <text x="665" y="540" fill="#fff7ed" font-size="11" font-weight="600">MariaDB 12.2</text>
  <text x="665" y="558" fill="#fdba74" font-size="10">scoreboard · events · cards</text>
  <text x="665" y="574" fill="#fdba74" font-size="10">profiles · rankings · honors</text>

  <!-- Arrow: api → mariadb -->
  <line x1="360" y1="555" x2="640" y2="555" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="460" y="548" fill="#fb923c" font-size="9">SQL</text>

  <!-- Arrow: jiiku → api -->
  <line x1="175" y1="756" x2="175" y2="608" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow-blue)"/>

  <!-- Arrow: web → mariadb -->
  <line x1="710" y1="432" x2="710" y2="502" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow-orange)"/>

  <!-- ═══ PROXY ═══ -->
  <rect x="640" y="640" width="220" height="90" rx="10" fill="url(#card-teal)" filter="url(#shadow)"/>
  <text x="665" y="660" fill="#a5f3fc" font-size="10" font-weight="700" letter-spacing="1">PROXY  ·  :3128  ·  .68</text>
  <text x="665" y="678" fill="#f0fdfa" font-size="11" font-weight="600">Envoy 1.37</text>
  <text x="665" y="696" fill="#67e8f9" font-size="10">RBAC per-service allowlist</text>
  <text x="665" y="710" fill="#22d3ee" font-size="9">DNS caching · Forward proxy</text>

  <!-- Arrow: api → proxy -->
  <line x1="360" y1="598" x2="360" y2="690" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="360" y1="690" x2="640" y2="690" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="420" y="683" fill="#22d3ee" font-size="9">egress</text>

  <!-- ═══ BOT ═══ -->
  <rect x="60" y="640" width="230" height="84" rx="10" fill="url(#card-pink)" filter="url(#shadow)"/>
  <text x="85" y="660" fill="#fbcfe8" font-size="10" font-weight="700" letter-spacing="1">BOT  ·  .66</text>
  <text x="85" y="678" fill="#fdf2f8" font-size="11" font-weight="600">discord.py ·  Python 3.14</text>
  <text x="85" y="696" fill="#f9a8d4" font-size="10">Stats · Translations · Deployment</text>
  <text x="85" y="712" fill="#f9a8d4" font-size="10">mysql-connector · scipy</text>

  <!-- Arrow: bot → proxy -->
  <line x1="290" y1="690" x2="640" y2="690" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Arrow: api → bot (data) -->
  <line x1="175" y1="640" x2="175" y2="608" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow-blue)"/>

  <!-- ═══ JIIKU ═══ -->
  <rect x="60" y="756" width="230" height="96" rx="10" fill="url(#card-slate)" filter="url(#shadow)"/>
  <text x="85" y="776" fill="#cbd5e1" font-size="10" font-weight="700" letter-spacing="1">JIIKU  (dev, prod)  · .3, .6</text>
  <text x="85" y="794" fill="#f8fafc" font-size="11" font-weight="600">Python 3.14  ·  Bazel</text>
  <text x="85" y="812" fill="#94a3b8" font-size="10">Unity asset compilation</text>
  <text x="85" y="828" fill="#94a3b8" font-size="10">Game data builder</text>
  <text x="85" y="844" fill="#64748b" font-size="9">prod → branch: main  /  dev → branch: dev</text>

  <!-- Arrow: jiiku → proxy -->
  <line x1="290" y1="804" x2="600" y2="804" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="600" y1="804" x2="600" y2="730" stroke="#22d3ee" stroke-width="1.2"/>
  <line x1="600" y1="730" x2="640" y2="710" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ═══ MAWASHI ═══ -->
  <rect x="340" y="756" width="250" height="80" rx="10" fill="#1c2a1e" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#shadow-sm)"/>
