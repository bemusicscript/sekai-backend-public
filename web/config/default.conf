# Backend API
server {
    listen 8080 default_server;
    listen 4443 ssl default_server;
    http2 on;
    server_name api.sekai.run;

    ssl_certificate /etc/nginx/snakeoil.pem;
    ssl_certificate_key /etc/nginx/snakeoil.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    sendfile off;
    tcp_nopush on;
    tcp_nodelay on;
    absolute_redirect off;

    access_log off;
    root /var/www/backend/www;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?q=$uri&$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_param   SCRIPT_FILENAME  $document_root/index.php;
        fastcgi_buffering on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_busy_buffers_size 64k;
        include fastcgi_params;
    }
}

# assets
server {
    listen 8080;
    listen 4443 ssl;
    http2 on;
    server_name asset.sekai.run;

    ssl_certificate /etc/nginx/snakeoil.pem;
    ssl_certificate_key /etc/nginx/snakeoil.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    absolute_redirect off;

    access_log off;
    index index.html;

    open_file_cache max=100000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    error_page 403 /404.html;
    error_page 404 /404.html;

    root /var/www/asset/www;
    location ^~ /mysekai/ {
        alias /var/www/asset/mysekai/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /character/ {
        alias /var/www/asset/character/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
